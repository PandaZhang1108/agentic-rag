<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic RAG · 调试台</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #11161d;
    --border: #1f2733;
    --text: #d7dee6;
    --text-dim: #6b7685;
    --accent: #4fd1a5;
    --accent-dim: #2a5c48;
    --user-bubble: #1a2432;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 顶部状态栏：显示当前 thread_id，让你直观看到"多轮对话"是不是真的在复用同一个会话 */
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header .title { font-size: 13px; letter-spacing: 0.04em; color: var(--text-dim); }
  header .title b { color: var(--accent); font-weight: 600; }
  header .thread {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .thread .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-dim);
  }
  header .thread .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent-dim); color: var(--accent); }

  /* 对话区 */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (max-width: 900px) { #log { padding: 20px 5%; } }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .msg .role {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .msg .bubble {
    padding: 11px 14px;
    border-radius: 8px;
    line-height: 1.6;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid var(--border); }
  .msg.assistant .bubble {
    background: transparent;
    border: 1px solid var(--accent-dim);
    border-left: 2px solid var(--accent);
  }
  .msg.assistant .bubble.streaming::after {
    content: "▍";
    color: var(--accent);
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .msg.system .bubble {
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 12px;
  }

  /* 输入区 */
  #inputRow {
    border-top: 1px solid var(--border);
    padding: 14px 18%;
    background: var(--panel);
    display: flex;
    gap: 10px;
  }
  @media (max-width: 900px) { #inputRow { padding: 14px 5%; } }

  #inputRow textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    padding: 10px 12px;
    height: 44px;
    line-height: 1.4;
  }
  #inputRow textarea:focus { outline: none; border-color: var(--accent-dim); }
  #inputRow button {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  #inputRow button:disabled { opacity: 0.4; cursor: not-allowed; }
  #inputRow button:hover:not(:disabled) { background: var(--accent); color: #06110c; }
</style>
</head>
<body>

<header>
  <div class="title">Agentic RAG · <b>调试台</b></div>
  <div class="thread">
    <span class="dot" id="threadDot"></span>
    <span id="threadLabel">新会话（还没发送第一条消息）</span>
    <button id="resetBtn">开新会话</button>
  </div>
</header>

<div id="log"></div>

<div id="inputRow">
  <textarea id="input" placeholder="输入问题，回车发送（Shift+回车换行）..."></textarea>
  <button id="sendBtn">发送</button>
</div>

<script>
// ------------------------------------------------------------------
// 配置：后端地址
// ------------------------------------------------------------------
const API_URL = "http://localhost:8000/chat";

// ------------------------------------------------------------------
// 这个调试台是纯静态页面，没有构建步骤，所以 key 只能放在这里，
// 也就意味着【任何打开页面的人都能从源码里看到它】。
// 这在"本机调试工具"这个定位下是可以接受的，但必须写清楚：
//   - 生产环境绝不能这么干
//   - 部署到公网时，正确做法是前端不持有 key，
//     由一个后端(BFF)代为转发并在服务端注入 key
//
// 本地使用：把下面的值改成你 .env 里的 API_KEY，
// 或者打开页面后在浏览器控制台执行：localStorage.setItem('apiKey','你的key')
// ------------------------------------------------------------------
const API_KEY = localStorage.getItem("apiKey") || "dev-local-key";

// ------------------------------------------------------------------
// 状态：当前会话的 thread_id
// 这是实现"多轮对话"的关键——第一次发消息时不带 thread_id（后端会新建一个），
// 后端返回的 thread_id 会被存在这个变量里，之后每一次发消息都带上它，
// 后端才能在 Postgres 里找到、接上同一场对话的历史记忆。
// ------------------------------------------------------------------
let currentThreadId = null;

const logEl = document.getElementById("log");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const threadDot = document.getElementById("threadDot");
const threadLabel = document.getElementById("threadLabel");
const resetBtn = document.getElementById("resetBtn");

function appendMessage(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const roleLabel = { user: "你", assistant: "Agent", system: "系统" }[role];
  wrap.innerHTML = `<div class="role">${roleLabel}</div><div class="bubble"></div>`;
  wrap.querySelector(".bubble").textContent = text;
  logEl.appendChild(wrap);
  logEl.scrollTop = logEl.scrollHeight;
  return wrap.querySelector(".bubble");
}

function setThreadDisplay(id) {
  currentThreadId = id;
  threadDot.classList.add("live");
  threadLabel.textContent = "thread_id: " + id;
}

resetBtn.addEventListener("click", () => {
  currentThreadId = null;
  threadDot.classList.remove("live");
  threadLabel.textContent = "新会话（还没发送第一条消息）";
  logEl.innerHTML = "";
  appendMessage("system", "已开启新会话，之前的对话记忆不会被带入。");
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  sendBtn.disabled = true;
  appendMessage("user", text);

  // 创建一个空的助手气泡，后面收到的 token 会一段段填进这个气泡里
  const bubble = appendMessage("assistant", "");
  bubble.classList.add("streaming");

  const body = { message: text };
  if (currentThreadId) {
    body.thread_id = currentThreadId;   // 带上已有的 thread_id，实现多轮对话
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": API_KEY,
      },
      body: JSON.stringify(body),
    });

    if (!response.ok) {
      // 把常见状态码翻译成人话，省得每次都要去翻后端日志
      const hints = {
        401: "鉴权失败：X-API-Key 和后端 .env 里的 API_KEY 不一致。",
        422: "请求内容不合法：message 不能为空，thread_id 必须是 UUID 格式。",
        429: "触发限流，稍等一会儿再试。",
        503: "后端就绪检查失败，通常是数据库连不上。",
      };
      bubble.textContent =
        `请求失败：HTTP ${response.status}\n` + (hints[response.status] || "");
      bubble.classList.remove("streaming");
      sendBtn.disabled = false;
      return;
    }

    // ------------------------------------------------------------
    // 手动按行解析 SSE 流。
    // 后端每条消息格式是：data: {...}\n\n
    // fetch 拿到的 body 是一个可以逐块读取的流（ReadableStream），
    // 我们用 getReader() 拿到读取器，反复 read()，
    // 每次可能拿到一小段文本（不一定刚好是一整条消息，可能被截断），
    // 所以要自己维护一个 buffer，按 \n\n 切出完整的一条条消息。
    // ------------------------------------------------------------
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let fullText = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // 按 SSE 的分隔符 \n\n 切出所有"已经完整收到"的消息块
      let sepIndex;
      while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
        const rawEvent = buffer.slice(0, sepIndex);
        buffer = buffer.slice(sepIndex + 2);

        if (!rawEvent.startsWith("data: ")) continue;
        const payload = rawEvent.slice("data: ".length);

        if (payload === "[DONE]") {
          bubble.classList.remove("streaming");
          continue;
        }

        let msg;
        try {
          msg = JSON.parse(payload);
        } catch (e) {
          continue; // 解析失败就跳过这一条，不让整个流程崩掉
        }

        if (msg.type === "thread_id") {
          setThreadDisplay(msg.value);
        } else if (msg.type === "token") {
          fullText += msg.value;
          bubble.textContent = fullText;
          logEl.scrollTop = logEl.scrollHeight;
        } else if (msg.type === "error") {
          // 流中错误作为可见消息追加，随后结束加载状态。
          fullText += (fullText ? "\n\n" : "") + "⚠ " + msg.value;
          bubble.textContent = fullText;
          bubble.classList.remove("streaming");
          logEl.scrollTop = logEl.scrollHeight;
        }
      }
    }
  } catch (err) {
    bubble.textContent = "连接出错：" + err.message + "（后端是不是没启动，或者被防火墙/CORS 拦了？）";
    bubble.classList.remove("streaming");
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

appendMessage("system", "输入问题开始对话。发第一条消息后，thread_id 会显示在右上角——之后的追问都会自动带上它，用来测试多轮记忆是否生效。");
</script>

</body>
</html>
